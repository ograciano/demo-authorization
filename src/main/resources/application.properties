spring.application.name=authorization
server.port=8081

spring.datasource.url=jdbc:h2:mem:authorizationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

security.jwt.secret=replace-with-a-secure-256-bit-secret-key-at-least-32-bytes

authorization.permissions.allowed=REPORT:READ,REPORT:DOWNLOAD,ADMIN:MANAGE_PERMISSIONS
