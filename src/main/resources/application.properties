spring.application.name=authorization
spring.datasource.url=jdbc:h2:mem:authorization;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
app.security.jwt-secret=dev-jwt-secret-authorization
app.permissions.allowed=REPORT:DOWNLOAD,REPORT:READ,INTERNAL:PERMISSIONS_READ
server.port=8081
